<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたしの献立</title>
<style>
:root{
  --bg:#fbf7f1;--card:#fffdf9;--beige:#efe2d3;--beige2:#f6eee5;
  --red:#cf4b48;--red2:#f6d8d4;--ink:#4a3b34;--muted:#8b7b72;--line:#eadfd5;
  --green:#eaf1e4;--shadow:0 8px 24px rgba(92,67,49,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 94px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.brand{font-weight:800;font-size:22px}.heart{color:var(--red)}
.monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.iconbtn{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);color:var(--ink)}
h2{font-size:19px;margin:0}
.calendar{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:var(--shadow)}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}.week div:first-child{color:var(--red)}
.day{min-height:74px;border:1px solid #f0e8e0;background:#fff;border-radius:13px;padding:7px;position:relative;text-align:left;overflow:hidden}
.day.empty{background:transparent;border-color:transparent}.day.today{outline:2px solid var(--red)}
.day .n{font-weight:700;font-size:13px}.day.has::after{content:"♥";position:absolute;right:6px;bottom:5px;color:var(--red);font-size:10px}
.day .mini{display:block;margin-top:5px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:17px}
.mealrow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;margin:8px 0;background:var(--beige2)}
.mealrow:nth-child(3){background:#fff2ee}.mealrow:nth-child(4){background:var(--green)}
.badge{font-size:12px;font-weight:800}.mealname{font-weight:650}.mealname.link{color:var(--red);cursor:pointer;text-decoration:none}.mealname.link:active{opacity:.65}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.primary,.secondary{border:0;border-radius:999px;padding:12px 18px;font-weight:750}
.primary{background:var(--red);color:white}.secondary{background:var(--red2);color:var(--red)}
.full{width:100%;margin-top:12px}
.view{display:none}.view.active{display:block}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.catbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.catbar::-webkit-scrollbar{display:none}.catbtn{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:750}.catbtn.active{background:var(--red);border-color:var(--red);color:#fff}
.picker{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;margin:8px 0}.picker .pickname{flex:1;font-weight:700}.picker .picksub{font-size:11px;color:var(--muted);margin-top:3px}.pickbtn{border:0;background:var(--red2);color:var(--red);border-radius:999px;padding:8px 12px;font-weight:800}.fav{border:0;background:transparent;color:var(--red);font-size:21px;padding:4px}.mealchoice{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;padding:12px;border-radius:16px;margin:9px 0;background:var(--beige2)}.mealchoice:nth-child(3){background:#fff2ee}.mealchoice:nth-child(4){background:var(--green)}.choiceactions{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}.tiny{border:0;border-radius:999px;padding:7px 10px;background:#fff;color:var(--red);font-size:12px;font-weight:750}.manual{margin-top:8px}
.recipe{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.recipe:last-child{border-bottom:0}.recipeicon{width:48px;height:48px;border-radius:14px;background:var(--beige);display:grid;place-items:center;font-size:24px}
.recipebody{flex:1}.tags{font-size:11px;color:var(--muted);margin-top:4px}
.smallbtn{border:0;background:transparent;color:var(--red);font-size:20px}
.emptymsg{text-align:center;color:var(--muted);padding:24px 8px}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,253,249,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav{border:0;background:none;color:var(--muted);padding:7px 2px;font-size:11px}.nav span{display:block;font-size:21px;margin-bottom:2px}.nav.active{color:var(--red);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(55,42,34,.34);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheethead h3{margin:0}.close{border:0;background:#fff;width:36px;height:36px;border-radius:50%}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.settingrow{padding:14px 0;border-bottom:1px solid var(--line)}
.shopping-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.shopping-item input{width:20px;height:20px}
@media(max-width:480px){.app{padding-left:10px;padding-right:10px}.calendar{padding:8px}.day{min-height:64px;padding:5px}.day .mini{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">わたしの献立 <span class="heart">♥</span></div><button class="secondary" onclick="openMeal()">＋ 献立</button></header>

<section id="mealView" class="view active">
  <div class="monthbar"><button class="iconbtn" onclick="moveMonth(-1)">‹</button><h2 id="monthTitle"></h2><button class="iconbtn" onclick="moveMonth(1)">›</button></div>
  <div class="calendar"><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="cal" class="grid"></div></div>
  <div id="dayCard" class="card"></div>
</section>

<section id="recipeView" class="view">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>レシピ帳</h2><button class="primary" onclick="openRecipe()">＋ 追加</button></div>
  <div class="card"><div id="recipeCats" class="catbar"></div><input id="recipeSearch" class="search" placeholder="料理名・タグ・食材で検索" oninput="renderRecipes()"><div id="recipeList"></div></div>
</section>

<section id="shopView" class="view">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>買い物リスト</h2><button class="secondary" onclick="addShop()">＋ 追加</button></div>
  <div class="card"><div id="shopList"></div></div>
</section>

<section id="settingsView" class="view">
  <h2>設定</h2>
  <div class="card"><h3>データ管理</h3>
    <div class="settingrow"><b>自動保存</b><div class="note">入力した献立・レシピ・買い物リストは、このブラウザに自動保存されます。</div></div>
    <div class="settingrow"><button class="secondary full" onclick="exportData()">バックアップを書き出す</button></div>
    <div class="settingrow"><label>バックアップを読み込む</label><input type="file" accept=".json" onchange="importData(event)"></div>
  </div>
</section>
</div>

<nav class="bottom">
<button class="nav active" onclick="showView('meal',this)"><span>▣</span>献立</button>
<button class="nav" onclick="showView('recipe',this)"><span>♡</span>レシピ</button>
<button class="nav" onclick="showView('shop',this)"><span>🛒</span>買い物</button>
<button class="nav" onclick="showView('settings',this)"><span>⚙</span>設定</button>
</nav>

<div id="mealModal" class="modal"><div class="sheet">
<div class="sheethead"><h3 id="mealModalTitle">献立を登録</h3><button class="close" onclick="closeModal('mealModal')">×</button></div>
<label>日付</label><input id="mealDate" type="date">
<div id="mealInputs"></div>
<button class="primary full" onclick="saveMeal()">保存する</button>
</div></div>

<div id="recipeModal" class="modal"><div class="sheet">
<div class="sheethead"><h3>レシピを登録</h3><button class="close" onclick="closeModal('recipeModal')">×</button></div>
<input type="hidden" id="recipeId">
<label>料理名</label><input id="rName" placeholder="例：鶏の照り焼き">
<div class="twocol"><div><label>分類</label><select id="rType"><option>主食</option><option selected>主菜</option><option>副菜</option><option>汁物</option><option>デザート</option><option>お弁当</option></select></div><div><label>レシピの場所</label><select id="rSource"><option>Instagram</option><option>Web</option><option>Kindle</option><option>レシピ本</option><option>自分のレシピ</option></select></div></div>
<label>URL（Instagram・Webなど）</label><input id="rUrl" placeholder="https://...">
<label>本の名前・ページ</label><input id="rBook" placeholder="例：○○の献立 P.82">
<label>タグ</label><input id="rTags" placeholder="例：鶏肉, 簡単, 子ども">
<label>メモ</label><textarea id="rMemo" placeholder="味付けや作るときのポイントなど"></textarea>
<button class="primary full" onclick="saveRecipe()">保存する</button>
</div></div>

<div id="pickerModal" class="modal"><div class="sheet">
<div class="sheethead"><h3 id="pickerTitle">レシピから選ぶ</h3><button class="close" onclick="closeModal('pickerModal')">×</button></div>
<input id="pickerSearch" class="search" placeholder="レシピを検索" oninput="renderPicker()">
<div id="pickerList"></div>
</div></div>

<div id="recipeDetailModal" class="modal"><div class="sheet">
<div class="sheethead"><h3 id="detailName">レシピ詳細</h3><button class="close" onclick="closeModal('recipeDetailModal')">×</button></div>
<div id="recipeDetailBody"></div>
</div></div>

<script>
const KEY='watashi_kondate_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{meals:{},recipes:[],shopping:[]};
let cursor=new Date(); cursor.setDate(1);
let selected=dateKey(new Date());
const types=['主食','主菜','副菜','汁物'];
const recipeTypes=['すべて','主食','主菜','副菜','汁物','デザート','お弁当'];
let recipeCategory='すべて', pickerType='';
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showView(v,btn){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(v==='recipe')renderRecipes();if(v==='shop')renderShop()}
function moveMonth(n){cursor.setMonth(cursor.getMonth()+n);renderCalendar()}
function renderCalendar(){
 document.getElementById('monthTitle').textContent=`${cursor.getFullYear()}年${cursor.getMonth()+1}月`;
 const cal=document.getElementById('cal');cal.innerHTML='';
 const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++){let e=document.createElement('div');e.className='day empty';cal.appendChild(e)}
 for(let n=1;n<=days;n++){let d=new Date(y,m,n),k=dateKey(d),meal=data.meals[k]||{},b=document.createElement('button');b.className='day'+(Object.values(meal).some(Boolean)?' has':'')+(k===dateKey(new Date())?' today':'');let firstMeal=types.map(t=>meal[t]).find(Boolean)||'';b.innerHTML=`<span class="n">${n}</span>${firstMeal?`<span class="mini">${esc(firstMeal)}</span>`:''}`;b.onclick=()=>{selected=k;renderDay();};cal.appendChild(b)}
 renderDay()
}
function renderDay(){
 const d=new Date(selected+'T00:00:00'), meal=data.meals[selected]||{};
 const card=document.getElementById('dayCard');
 card.innerHTML=`<h3>${d.getMonth()+1}月${d.getDate()}日の献立</h3>`+types.map((t,i)=>{let name=meal[t]||'',r=data.recipes.find(x=>x.name===name);return `<div class="mealrow"><div class="badge">${['🍚','🍖','🥗','🥣'][i]} ${t}</div><div><div class="mealname${r?' link':''}" ${r?`onclick="openRecipeDetail('${r.id}')"`:''}>${esc(name||'未登録')}${r?'  ›':''}</div>${name?recipeSub(name):''}</div><button class="smallbtn" onclick="openMeal('${t}')">✎</button></div>`}).join('')+`<button class="secondary full" onclick="openMeal()">この日の献立を編集</button>`;
}
function recipeSub(name){let r=data.recipes.find(x=>x.name===name);return r?`<div class="sub">${esc(r.source||'')} ${r.book?'・'+esc(r.book):''}</div>`:''}
function openMeal(focus=''){
 document.getElementById('mealDate').value=selected;
 let meal=data.meals[selected]||{};
 document.getElementById('mealInputs').innerHTML=types.map((t,i)=>`<div class="mealchoice"><div class="badge">${['🍚','🍖','🥗','🥣'][i]} ${t}</div><div><div id="mealDisplay_${t}" class="mealname">${esc(meal[t]||'未選択')}</div><input type="hidden" id="meal_${t}" value="${esc(meal[t]||'')}"><div class="choiceactions"><button class="tiny" onclick="openPicker('${t}')">レシピから選ぶ</button><button class="tiny" onclick="toggleManual('${t}')">直接入力</button></div><input class="manual" id="manual_${t}" value="${esc(meal[t]||'')}" placeholder="${t}を入力" style="display:none" oninput="setManual('${t}',this.value)"></div></div>`).join('');
 document.getElementById('mealModal').classList.add('show');
 if(focus)setTimeout(()=>openPicker(focus),120)
}
function toggleManual(t){let el=document.getElementById('manual_'+t);el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')el.focus()}
function setManual(t,v){document.getElementById('meal_'+t).value=v.trim();document.getElementById('mealDisplay_'+t).textContent=v.trim()||'未選択'}
function openPicker(t){pickerType=t;document.getElementById('pickerTitle').textContent=t+'のレシピから選ぶ';document.getElementById('pickerSearch').value='';renderPicker();document.getElementById('pickerModal').classList.add('show')}
function renderPicker(){let q=(document.getElementById('pickerSearch')?.value||'').toLowerCase(),list=data.recipes.filter(r=>r.type===pickerType&&(r.name+' '+r.tags+' '+r.memo).toLowerCase().includes(q));list.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||a.name.localeCompare(b.name,'ja'));document.getElementById('pickerList').innerHTML=list.length?list.map(r=>`<div class="picker"><button class="fav" onclick="event.stopPropagation();toggleFavorite('${r.id}')">${r.favorite?'♥':'♡'}</button><div class="pickname">${esc(r.name)}<div class="picksub">${esc(r.source||'')}${r.tags?' ・ '+esc(r.tags):''}</div></div><button class="pickbtn" onclick="chooseRecipe('${r.id}')">選ぶ</button></div>`).join(''):`<div class="emptymsg">${esc(pickerType)}のレシピがまだありません。<br>レシピ帳から登録できます。</div>`}
function chooseRecipe(id){let r=data.recipes.find(x=>x.id===id);if(!r)return;document.getElementById('meal_'+pickerType).value=r.name;document.getElementById('mealDisplay_'+pickerType).textContent=r.name;let m=document.getElementById('manual_'+pickerType);if(m)m.value=r.name;closeModal('pickerModal')}
function saveMeal(){let k=document.getElementById('mealDate').value;if(!k)return;data.meals[k]={};types.forEach(t=>data.meals[k][t]=document.getElementById('meal_'+t).value.trim());selected=k;save();closeModal('mealModal');cursor=new Date(k+'T00:00:00');cursor.setDate(1);renderCalendar()}
function openRecipeDetail(id){
 let r=data.recipes.find(x=>x.id===id);if(!r)return;
 document.getElementById('detailName').textContent=r.name;
 let source=r.source||'', action='';
 if(r.url){let label=source==='Instagram'?'Instagramでレシピを見る':source==='Web'?'レシピサイトを開く':'レシピを開く';action=`<button class="primary full" onclick="window.open('${esc(r.url)}','_blank')">${label} ↗</button>`}
 let info=`<div class="card" style="margin-top:0"><div class="tags">${esc(r.type||'')} ・ ${esc(source)}</div>${r.book?`<div class="settingrow"><b>📕 本・ページ</b><div class="note" style="margin-top:5px">${esc(r.book)}</div></div>`:''}${r.tags?`<div class="settingrow"><b>タグ</b><div class="note" style="margin-top:5px">${esc(r.tags)}</div></div>`:''}${r.memo?`<div class="settingrow"><b>メモ</b><div class="note" style="margin-top:5px;white-space:pre-wrap">${esc(r.memo)}</div></div>`:''}${action}<button class="secondary full" onclick="closeModal('recipeDetailModal');openRecipe('${r.id}')">レシピ情報を編集</button></div>`;
 document.getElementById('recipeDetailBody').innerHTML=info;
 document.getElementById('recipeDetailModal').classList.add('show');
}
function openRecipe(id=''){let r=data.recipes.find(x=>x.id===id)||{};recipeId.value=r.id||'';rName.value=r.name||'';rType.value=r.type||'主菜';rSource.value=r.source||'Instagram';rUrl.value=r.url||'';rBook.value=r.book||'';rTags.value=r.tags||'';rMemo.value=r.memo||'';document.getElementById('recipeModal').classList.add('show')}
function saveRecipe(){if(!rName.value.trim()){alert('料理名を入力してください');return}let i=data.recipes.findIndex(x=>x.id===recipeId.value),fav=i>=0?!!data.recipes[i].favorite:false;let obj={id:recipeId.value||String(Date.now()),name:rName.value.trim(),type:rType.value,source:rSource.value,url:rUrl.value.trim(),book:rBook.value.trim(),tags:rTags.value.trim(),memo:rMemo.value.trim(),favorite:fav};if(i>=0)data.recipes[i]=obj;else data.recipes.unshift(obj);save();closeModal('recipeModal');renderRecipes()}
function iconFor(t){return t==='主食'?'🍚':t==='主菜'?'🍖':t==='副菜'?'🥗':t==='汁物'?'🥣':t==='デザート'?'🍰':'🍱'}
function setRecipeCategory(t){recipeCategory=t;renderRecipes()}
function toggleFavorite(id){let r=data.recipes.find(x=>x.id===id);if(!r)return;r.favorite=!r.favorite;save();renderRecipes();if(document.getElementById('pickerModal').classList.contains('show'))renderPicker()}
function renderRecipes(){
 let cats=document.getElementById('recipeCats');if(cats)cats.innerHTML=recipeTypes.map(t=>`<button class="catbtn ${recipeCategory===t?'active':''}" onclick="setRecipeCategory('${t}')">${t==='すべて'?'すべて':iconFor(t)+' '+t}</button>`).join('');
 let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase(),list=data.recipes.filter(r=>(recipeCategory==='すべて'||r.type===recipeCategory)&&(r.name+' '+r.type+' '+r.tags+' '+r.memo).toLowerCase().includes(q));
 list.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0));
 document.getElementById('recipeList').innerHTML=list.length?list.map(r=>`<div class="recipe"><div class="recipeicon">${iconFor(r.type)}</div><div class="recipebody"><b>${esc(r.name)}</b><div class="tags">${esc(r.type)} ・ ${esc(r.source)}${r.tags?' ・ '+esc(r.tags):''}</div></div><button class="fav" onclick="toggleFavorite('${r.id}')">${r.favorite?'♥':'♡'}</button>${r.url?`<button class="smallbtn" onclick="window.open('${esc(r.url)}','_blank')">↗</button>`:''}<button class="smallbtn" onclick="openRecipe('${r.id}')">›</button></div>`).join(''):`<div class="emptymsg">このカテゴリにはまだレシピがありません。<br>「＋ 追加」から登録できます ♡</div>`
}
function addShop(){let name=prompt('買うものを入力してください');if(name&&name.trim()){data.shopping.push({id:String(Date.now()),name:name.trim(),done:false});save();renderShop()}}
function toggleShop(id){let x=data.shopping.find(x=>x.id===id);if(x)x.done=!x.done;save();renderShop()}
function renderShop(){document.getElementById('shopList').innerHTML=data.shopping.length?data.shopping.map(x=>`<div class="shopping-item"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}')"><span style="${x.done?'text-decoration:line-through;color:#999':''}">${esc(x.name)}</span></div>`).join(''):`<div class="emptymsg">買い物リストは空です 🛒</div>`}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kondate-backup-'+dateKey(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.meals||!x.recipes)throw 0;data=x;save();renderCalendar();renderRecipes();renderShop();alert('バックアップを読み込みました')}catch{alert('このバックアップは読み込めませんでした')}};r.readAsText(f)}
renderCalendar();renderRecipes();renderShop();
</script>
</body>
</html>
